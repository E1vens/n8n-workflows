version: "3.9"

services:
  bot:
    build: .
    container_name: veld21-bot
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.veld21-bot.rule=Host(`bot.veld-21.ru`)"
      - "traefik.http.routers.veld21-bot.entrypoints=websecure"
      - "traefik.http.routers.veld21-bot.tls.certresolver=le"
    networks:
      - traefik
    expose:
      - "8000"

networks:
  traefik:
    external: true
