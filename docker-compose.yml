version: "3.9"

services:
  bot:
    build: .
    container_name: veld21-bot-bot
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.veld21bot.rule=Host(`bot.veld-21.ru`)"
      - "traefik.http.routers.veld21bot.entrypoints=websecure"
      - "traefik.http.routers.veld21bot.tls.certresolver=le"
      - "traefik.http.services.veld21bot.loadbalancer.server.port=8000"
    networks:
      - traefik
    expose:
      - "8000"

networks:
  traefik:
    external: true
