version: "3.9"

services:
  bot:
    build: .
    container_name: veld21-bot-test
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.veld21-bot-test.rule=Host(`test-bot.veld-21.ru`)"
      - "traefik.http.routers.veld21-bot-test.entrypoints=websecure"
      - "traefik.http.routers.veld21-bot-test.tls.certresolver=le"
      - "traefik.http.services.veld21-bot-test.loadbalancer.server.port=8000"
    networks:
      - traefik
    expose:
      - "8000" 

networks:
  traefik:
    external: true
