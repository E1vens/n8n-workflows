name: Deploy to VPS

on:
  push:
    branches:
      - main
      - test/**
      - test*

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          BRANCH="${{ github.ref_name }}"

          if [[ "$BRANCH" == "main" ]]; then
            echo "▶️ Продакшн-деплой"
            DEPLOY_DIR="/root/veld21-bot"
            COMPOSE_FILE="docker-compose.yml"
            CONTAINER_NAME="veld21-bot"
            BOT_TOKEN="${{ secrets.TELEGRAM_TOKEN }}"
            WEBHOOK_URL="https://bot.veld-21.ru/webhook"
          else
            echo "🧪 Тест-деплой из ветки $BRANCH"
            DEPLOY_DIR="/root/veld21-bot-test"
            COMPOSE_FILE="docker-compose.test.yml"
            CONTAINER_NAME="veld21-bot-test"
            BOT_TOKEN="${{ secrets.TEST_TELEGRAM_TOKEN }}"
            WEBHOOK_URL="https://test-bot.veld-21.ru/webhook"
          fi

          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            set -e

            if [ ! -d "$DEPLOY_DIR" ]; then
              git clone git@github.com:${{ github.repository }} "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"
            git fetch origin
            git checkout "$BRANCH"
            git reset --hard origin/"$BRANCH"

            echo "TELEGRAM_TOKEN=$BOT_TOKEN" > .env
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
            echo "SUPABASE_APIKEY=${{ secrets.SUPABASE_APIKEY }}" >> .env
            echo "GIT_BRANCH=$BRANCH" >> .env
            echo "WEBHOOK_URL=$WEBHOOK_URL" >> .env

            docker compose -f "$COMPOSE_FILE" -p "$CONTAINER_NAME" down
            docker compose -f "$COMPOSE_FILE" -p "$CONTAINER_NAME" up -d --build

            echo "🔗 Устанавливаем Webhook: $WEBHOOK_URL"
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/setWebhook" \
                -H "Content-Type: application/json" \
                -d "{\"url\": \"$WEBHOOK_URL\"}"

            echo "⏳ Жду 60 секунд..."
            sleep 60

            echo "📦 Логи контейнера:"
            docker logs "$CONTAINER_NAME" --tail=100 || echo "Контейнер не стартовал или нет логов"
          EOF
